<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aportantes Electorales Uruguay</title>
<style>
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #142233; }
  a { color: #0a6fb3; }
</style>
</head>
<body>
<h1>Aportantes Electorales Uruguay</h1>
<p>Abriendo el buscador… La primera carga tarda unos segundos porque la base se descarga a tu navegador.</p>
<p>Si no se abre solo, <a id="go" href="#">entrá acá</a>.</p>
<script>
  // Datasette Lite (copia propia en lite/, con versiones fijas) corre en el navegador y carga
  // la base y los metadatos publicados junto a esta página.
  // El parámetro v evita que la caché de GitHub Pages sirva una base y metadatos de versiones distintas.
  const base = new URL('.', location.href).href;
  const v = '?v=' + Date.now();
  const target = base + 'lite/?url=' + encodeURIComponent(base + 'aportantes.db' + v) +
    '&metadata=' + encodeURIComponent(base + 'metadata.json' + v) + '#/aportantes/buscar';
  document.getElementById('go').href = target;
  location.replace(target);
</script>
</body>
</html>
